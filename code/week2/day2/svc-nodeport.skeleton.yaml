# NodePort 类型 Service 的填空骨架：把每一处尖括号替换成正确的取值，然后另存为 svc-nodeport.yaml。
#
# 与 ClusterIP 类型的清单文件相比，本文件有两处差别：
# 1. spec.type 的取值固定为 NodePort，表示在每个节点上开放一个固定端口，因此可以从集群外部访问。
# 2. 可以额外声明 spec.ports[].nodePort 字段。本次实验故意不声明该字段，
#    目的是观察 API Server 在 30000 至 32767 这个范围内自动分配端口的行为。
#
# 另外两件需要注意的事情：
# 1. 同一个 Service 中，port 与 nodePort 是两层不同的端口：nodePort 是节点上开放的端口，
#    客户端访问该端口之后，数据包先被转发到 ClusterIP 与 port 组成的地址，再被转发到 Pod 的 targetPort。
# 2. 从宿主机访问节点端口时不能使用 localhost。kind 的节点本身是一个 Docker 容器，
#    只有在创建集群时通过 extraPortMappings 声明过的端口才会被映射到宿主机。
apiVersion: v1
kind: Service
metadata:
  name: <>              # Service 的名称；同一个命名空间中不能与已有的 Service 重名
spec:
  type: NodePort
  selector:
    app: <>             # 取值必须与 Pod 模板的同名标签一致
  ports:
    - port: <>          # 客户端访问 Service 时使用的端口
      targetPort: <>    # 数据包被转发到 Pod 之后使用的端口
      # nodePort: <>    # 本次实验保留注释状态，让 API Server 自动分配端口
      protocol: TCP

# Deployment 的填空骨架：把每一处尖括号替换成正确的取值，然后另存为 deploy.webapp.yaml。
# 特别需要检查两处：selector.matchLabels 与 template.metadata.labels 必须完全一致，否则 API Server 会拒绝创建；
# 副本数量应当写在 replicas 字段中声明，而不是之后用 kubectl scale 命令临时设置。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp            # Deployment 的名称
spec:
  replicas: 3        # 期望的副本数量
  selector:
    matchLabels:
      app: webapp         # 选择器的标签，必须与下面模板中的同名标签完全一致
  template:
    metadata:
      labels:
        app: webapp       # 模板标签，必须与上面的选择器完全一致
        env: dev       # 其余标签可以自行指定
    spec:
      containers:
        - name: webapp    # 容器在 Pod 内部的名称
          image: webapp:v4   # 镜像名称与标签
          ports:
            - containerPort: 8080   # 容器监听的端口
          resources: {}
# 裸 Pod 的填空骨架：把每一处尖括号替换成正确的取值，然后另存为 pod.webapp.yaml。
# 对照方式：先执行 kubectl run webapp --image=webapp:v4 --port=8080 --dry-run=client -o yaml，
# 把命令的输出与自己写的这份逐字段比较，找出缺失的字段以及由 Kubernetes 自动补全的默认值。
apiVersion: v1
kind: Pod
metadata:
  name: <>            # Pod 的名称，必须在同一个命名空间内唯一
  labels:
    app: <>           # 标签的键为 app，取值为你自己指定，后面 Service 会用它来筛选 Pod
    env: <>           # 标签的键为 env，取值为你自己指定
spec:
  containers:
    - name: <>        # 容器在 Pod 内部的名称，同一个 Pod 内的容器名称必须互不相同
      image: <>       # 镜像名称与标签，必须与 kind load docker-image 导入的镜像一致
      ports:
        - containerPort: <>   # 容器监听的端口，该字段只起声明作用，不会创建端口映射

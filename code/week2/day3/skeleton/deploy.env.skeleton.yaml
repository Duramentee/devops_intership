# Deployment 的填空骨架（环境变量方式）：把每一处尖括号替换成正确的取值，然后另存为 deploy.env.yaml。
#
# 填写之前请依次确认下面六件事：
# 1. 填写完成之后，文件里不允许再出现尖括号。
# 2. 本清单由 code/week2/day1/deploy.webapp.yaml 修改而来，改动只有两处：镜像标签换成 webapp:v5，
#    并新增 envFrom 段落；其余字段的含义与 Day 1 完全一致。
# 3. metadata.name 仍然写成 webapp，目的是让 kubectl apply 就地修改 Day 1 已经存在的那个 Deployment，
#    而不是再创建第二个对象；因此 selector.matchLabels 与 template.metadata.labels 必须保持原来的取值，
#    否则 Deployment 的选择器属于不可变字段，apply 会因为「字段不可修改」而失败。
# 4. envFrom 与 env 的区别是：env 逐条指定键名，envFrom 一次注入被引用对象中的全部键。
# 5. envFrom 是一个列表，列表中的每一项要么是 configMapRef，要么是 secretRef，
#    两者不能合并写在同一个列表项里；被引用的对象必须位于同一个命名空间并且已经存在，
#    否则 Pod 会因为创建容器时找不到对象而停在 CreateContainerConfigError 状态。
# 6. 被注入的键名如果不合法（例如包含短横线），Kubernetes 会静默忽略这一个条目，
#    既不会报错，也不会产生事件（教材 7.4.4 节，p.332）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp                    # 与 Day 1 的对象同名，apply 会就地修改它
  labels:
    app: webapp
spec:
  replicas: <>                    # 期望的副本数量
  selector:
    matchLabels:
      app: <>                     # 必须与下面模板中的同名标签完全一致
  template:
    metadata:
      labels:
        app: <>                   # 模板标签，必须与上面的选择器完全一致
        env: dev
    spec:
      containers:
        - name: webapp
          image: <>               # 镜像名称与标签，本次实验使用今天构建出来的版本
          ports:
            - containerPort: 8080
          envFrom:                # 一次注入被引用对象中的全部键；这个段落的列表项是有顺序的
            - configMapRef:
                name: <>          # ConfigMap 对象的名称
            - secretRef:
                name: <>          # Secret 对象的名称
          resources: {}

# Secret 的填空骨架：把每一处尖括号替换成正确的取值，然后另存为 secret.yaml。
#
# 填写之前请依次确认下面五件事：
# 1. 填写完成之后，文件里不允许再出现尖括号。
# 2. Secret 的内容既可以通过 data 段落给出（取值必须写成已经做过 base64 编码的字符串），
#    也可以通过 stringData 段落给出（取值直接写明文，由 API Server 在写入之前完成编码）。
#    同一个键不允许在两个段落中同时出现。本次实验使用 stringData，目的是让你亲手确认
#    「写进去的是明文、读出来的是编码」这一过程，而不是直接抄一段 base64 字符串。
#    书写命令为 printf '%s' '<明文取值>' | base64。
# 3. type 字段省略时，Secret 的类型是 Opaque，也就是普通的键值对 Secret。
#    其他常见取值包括 kubernetes.io/tls（存放证书与私钥）、kubernetes.io/dockerconfigjson
#    （拉取私有镜像时使用）、kubernetes.io/service-account-token（服务账户令牌）。
# 4. 不要写入 status 段落（服务端字段）。
# 5. 本次实验的取值是演示用的伪凭证。真实项目中不要把凭证写进清单文件，
#    因为清单文件会进入代码仓库，而 Secret 只做 base64 编码、不做加密，任何人都可以解码还原。
apiVersion: v1
kind: Secret
metadata:
  name: <>                # Secret 的名称，Deployment 通过这个名称引用它
  labels:
    app: webapp           # 这个标签用于标记 Secret 对象本身，与 Deployment 的选择器没有关系
type: Opaque              # 省略该字段等价于 Opaque
stringData:               # 取值直接写明文，API Server 会在写入之前把它编码进 data 段落
  DB_PASSWORD: <>         # 键名会成为环境变量的名称，因此这个键名必须是合法的环境变量名称
